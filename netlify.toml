# Netlify build settings (read automatically when the site is linked to this repo)
[build]
  command = "npm run build"
  publish = "dist"
  # Build only commits whose message contains [deploy] (saves Netlify quota).
  # Exit 0 = skip this build, exit 1 = build. Day-to-day previews go to GitHub Pages instead.
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: unknown paths fall back to the game
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Game art keeps the same file name when it is replaced, so it may only be cached for a day
# (built JS/CSS get a new hashed name every build, so they are safe either way).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The page, manifest and service worker must always be fresh, so a new deploy reaches players.
# (public/_headers says the same; Netlify reads both.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
